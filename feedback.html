<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideen reviewen - Text Feedback Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1 class="gradient-text">Ideen & Feedback</h1>
            <div class="subtitle">Entdecken Sie Ideen und geben Sie Feedback</div>
        </header>

        <nav class="breadcrumb">
            <a href="index.html">← Zurück zur Startseite</a>
            <a href="submit.html" class="btn-link">+ Neue Idee einreichen</a>
        </nav>

        <div id="ideasContainer" class="ideas-container">
            <!-- Ideas will be dynamically loaded here -->
        </div>

        <div id="noIdeasMessage" class="no-ideas" style="display: none;">
            <div class="no-ideas-icon">📝</div>
            <h3>Noch keine Ideen vorhanden</h3>
            <p>Seien Sie der Erste und reichen Sie eine Idee ein!</p>
            <a href="submit.html" class="btn btn-primary">Idee einreichen</a>
        </div>
    </div>

    <!-- Modal for adding user feedback -->
    <div id="feedbackModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Feedback hinzufügen</h2>
            <p class="modal-hint">💡 Ihre markierte Textpassage wird automatisch übernommen</p>
            <form id="userFeedbackForm">
                <input type="hidden" id="feedbackIdeaId">

                <div class="form-group">
                    <label for="feedbackPassage">Referenzierte Textpassage *</label>
                    <textarea
                        id="feedbackPassage"
                        rows="3"
                        readonly
                        class="readonly-field"
                        placeholder="Markieren Sie zuerst Text im Ideenfeld..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="feedbackText">Ihr Feedback *</label>
                    <textarea
                        id="feedbackText"
                        rows="5"
                        placeholder="Geben Sie konstruktives Feedback zur markierten Passage..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="feedbackAuthor">Ihr Name (optional)</label>
                    <input type="text" id="feedbackAuthor" placeholder="Anonym">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Feedback senden</button>
                    <button type="button" class="btn btn-secondary" onclick="closeFeedbackModal()">
                        Abbrechen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
